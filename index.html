<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoomUps.in | Student Accommodation in Dharamshala</title>

<style>

:root{
    --bg:#F4F1EA;
    --white:#FFFFFF;
    --navy:#1E3A5F;
    --navy-dark:#172F4D;
    --gold:#D89B4A;
    --gold-dark:#B8792D;
    --text:#172033;
    --text-light:#526174;
    --muted:#7B8797;
    --border:#E3DED4;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body.modal-open{
    overflow:hidden;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
    color:inherit;
}


/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(244,241,234,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(30,58,95,.08);
}

.navbar{
    max-width:1200px;
    height:76px;
    margin:auto;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:26px;
    font-weight:900;
    color:var(--navy);
}

.logo span{
    color:var(--gold-dark);
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.language-select{
    height:42px;
    padding:0 30px 0 12px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:9px;
    color:var(--navy);
    font-weight:700;
}

.list-property-btn{
    border:none;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    padding:12px 18px;
    border-radius:9px;
    font-size:14px;
    font-weight:800;
}


/* ================= HERO ================= */

.hero{
    padding:90px 20px 100px;
    text-align:center;
    background:
        radial-gradient(circle at 50% -10%,rgba(216,155,74,.14),transparent 40%),
        linear-gradient(180deg,#F7F4EE,#F1EEE6);
}

.hero-container{
    max-width:1200px;
    margin:auto;
}

.hero-badge{
    display:inline-block;
    padding:9px 16px;
    border-radius:30px;
    background:rgba(30,58,95,.06);
    color:var(--navy);
    font-size:13px;
    font-weight:800;
    margin-bottom:20px;
}

.hero h1{
    max-width:900px;
    margin:auto;
    font-size:54px;
    line-height:1.08;
    letter-spacing:-2px;
}

.hero h1 span{
    color:var(--gold-dark);
}

.hero p{
    max-width:680px;
    margin:24px auto 38px;
    color:var(--text-light);
    font-size:17px;
    line-height:1.7;
}


/* ================= SEARCH ================= */

.search-box{
    max-width:950px;
    margin:auto;
    padding:13px;
    display:grid;
    grid-template-columns:1.2fr 1fr 1fr auto;
    gap:8px;
    text-align:left;
    background:#fff;
    border:1px solid rgba(30,58,95,.10);
    border-radius:16px;
    box-shadow:0 20px 50px rgba(38,45,55,.12);
}

.search-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:9px 14px;
    border-right:1px solid rgba(30,58,95,.08);
}

.search-field label{
    font-size:10px;
    color:var(--muted);
    font-weight:800;
    text-transform:uppercase;
}

.search-field select{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:14px;
    font-weight:600;
}

.search-btn{
    border:none;
    border-radius:10px;
    padding:0 25px;
    color:#fff;
    font-size:14px;
    font-weight:800;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
}


/* ================= SECTIONS ================= */

.section{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

.section-heading{
    margin-bottom:32px;
}

.section-heading h2{
    font-size:30px;
    color:var(--navy);
    margin-bottom:9px;
}

.section-heading p{
    color:var(--text-light);
    font-size:15px;
}


/* ================= CATEGORIES ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:17px;
}

.category-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:27px 15px;
    text-align:center;
    box-shadow:0 12px 25px rgba(38,45,55,.08);
    transition:.25s;
}

.category-card:hover{
    transform:translateY(-6px);
}

.category-icon{
    width:56px;
    height:56px;
    margin:auto auto 15px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    background:linear-gradient(145deg,#F6E6D0,#EED8BA);
}

.category-card h3{
    color:var(--navy);
    font-size:15px;
    margin-bottom:6px;
}

.category-card p{
    color:var(--muted);
    font-size:12px;
}


/* ================= AREAS ================= */

.areas{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.area-card{
    padding:21px;
    border-radius:13px;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 10px 22px rgba(38,45,55,.06);
    cursor:pointer;
    transition:.25s;
}

.area-card:hover{
    transform:translateY(-5px);
}

.area-card h3{
    color:var(--navy);
    font-size:15px;
    margin-bottom:6px;
}

.area-card p{
    color:var(--muted);
    font-size:12px;
}


/* ================= LISTINGS ================= */

.listings{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.listing-card{
    overflow:hidden;
    border-radius:16px;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 16px 35px rgba(38,45,55,.09);
}

.listing-image{
    height:190px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#E8E1D4;
    font-size:48px;
}

.listing-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.verified{
    position:absolute;
    top:12px;
    left:12px;
    z-index:2;
    padding:6px 10px;
    border-radius:20px;
    background:#E7F4EA;
    color:#24703A;
    font-size:10px;
    font-weight:800;
}

.listing-content{
    padding:19px;
}

.listing-type{
    font-size:10px;
    color:var(--gold-dark);
    font-weight:800;
    text-transform:uppercase;
    margin-bottom:8px;
}

.listing-content h3{
    color:var(--navy);
    font-size:18px;
    margin-bottom:7px;
}

.location{
    color:var(--text-light);
    font-size:13px;
    margin-bottom:15px;
}

.listing-info{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:17px;
}

.tag{
    padding:6px 8px;
    border-radius:6px;
    color:var(--text-light);
    background:#F5F2EC;
    border:1px solid #E8E2D8;
    font-size:10px;
}

.listing-bottom{
    padding-top:14px;
    border-top:1px solid #EEEAE2;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.price{
    color:var(--navy);
    font-size:20px;
    font-weight:900;
}

.price span{
    color:var(--muted);
    font-size:11px;
    font-weight:400;
}

.view-btn{
    border:none;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    padding:10px 16px;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
}

.listing-message{
    grid-column:1/-1;
    padding:35px;
    text-align:center;
    border:1px dashed #D8D1C5;
    border-radius:14px;
    color:var(--muted);
    background:rgba(255,255,255,.5);
}


/* ================= HOW IT WORKS ================= */

.how-section{
    background:#EDE9E0;
    border-top:1px solid rgba(30,58,95,.06);
    border-bottom:1px solid rgba(30,58,95,.06);
}

.steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

.step{
    padding:25px;
    text-align:center;
    border-radius:15px;
    background:#fff;
    border:1px solid rgba(30,58,95,.08);
}

.step-number{
    width:50px;
    height:50px;
    margin:auto auto 15px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),#31577F);
    font-weight:900;
}

.step h3{
    color:var(--navy);
    margin-bottom:8px;
}

.step p{
    color:var(--text-light);
    font-size:13px;
    line-height:1.6;
}


/* ================= OWNER CTA ================= */

.owner-section{
    padding:80px 20px;
}
.owner-box{
    max-width:1100px;
    margin:auto;
    padding:40px;
    border-radius:20px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
}

.owner-box h2{
    font-size:30px;
    margin-bottom:10px;
}

.owner-box p{
    color:rgba(255,255,255,.75);
    max-width:650px;
    line-height:1.6;
    font-size:14px;
}

.owner-btn{
    flex-shrink:0;
    border:none;
    padding:14px 20px;
    border-radius:9px;
    color:var(--navy);
    background:#fff;
    font-size:13px;
    font-weight:900;
}


/* ================= FOOTER ================= */

footer{
    background:#172F4D;
    color:#fff;
    padding:60px 20px 20px;
}

.footer-container{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr 1.4fr 1fr 1.2fr;
    gap:45px;
}

.footer-brand h2{
    font-size:25px;
    margin-bottom:12px;
}

.footer-brand p{
    color:rgba(255,255,255,.65);
    max-width:450px;
    line-height:1.7;
    font-size:13px;
}

.footer-column{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.footer-column h3{
    font-size:14px;
    margin-bottom:2px;
}

.footer-column a{
    color:rgba(255,255,255,.65);
    font-size:13px;
}

.footer-column a:hover{
    color:#fff;
}

.footer-founders{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.footer-founder-name{
    color:rgba(255,255,255,.72);
    font-size:13px;
    line-height:1.4;
}

.footer-email{
    color:rgba(255,255,255,.72);
    font-size:13px;
    word-break:break-word;
}

.footer-email:hover{
    color:#fff;
}

.footer-bottom{
    max-width:1200px;
    margin:40px auto 0;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.10);
    color:rgba(255,255,255,.45);
    font-size:11px;
    text-align:center;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(15,24,37,.65);
    backdrop-filter:blur(8px);
}

.modal-overlay.active{
    display:flex;
}

.property-modal{
    width:min(900px,100%);
    max-height:92vh;
    overflow-y:auto;
    border-radius:20px;
    background:#fff;
    box-shadow:0 30px 80px rgba(0,0,0,.25);
}

.modal-header{
    position:sticky;
    top:0;
    z-index:10;
    padding:22px 30px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    background:#fff;
    border-bottom:1px solid var(--border);
}

.modal-header h2{
    color:var(--navy);
    font-size:24px;
}

.modal-header p{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
}

.close-modal{
    border:none;
    background:#F4F1EA;
    color:var(--navy);
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:22px;
}

.property-form{
    padding:25px 30px 30px;
}


/* ================= FORM SECTIONS ================= */

.form-section{
    margin-bottom:30px;
}

.form-section-title{
    margin-bottom:18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
    color:var(--navy);
    font-size:18px;
    font-weight:900;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:17px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    color:var(--text);
    font-size:12px;
    font-weight:800;
}

.required{
    color:#C44343;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid #DCD7CD;
    border-radius:9px;
    outline:none;
    color:var(--text);
    background:#fff;
    font-size:13px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(216,155,74,.12);
}


/* ================= AVAILABILITY ================= */

.availability-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;
}


/* ================= LOCATION ================= */

.location-box{
    padding:18px;
    border-radius:12px;
    border:1px solid #DCD7CD;
    background:#FAF8F3;
}

.location-box-title{
    color:var(--navy);
    font-size:14px;
    font-weight:900;
    margin-bottom:7px;
}

.location-box-description{
    color:var(--text-light);
    font-size:12px;
    line-height:1.6;
    margin-bottom:14px;
}

.location-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.location-btn{
    border:none;
    padding:11px 14px;
    border-radius:8px;
    font-size:12px;
    font-weight:800;
}

.current-location-btn{
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
}

.maps-btn{
    color:var(--navy);
    background:#E8EDF2;
}

.maps-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.location-status{
    margin-top:10px;
    color:var(--text-light);
    font-size:12px;
}

.coordinates{
    margin-top:13px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.coordinate-box{
    padding:10px;
    border-radius:8px;
    background:#fff;
    border:1px solid var(--border);
}

.coordinate-box small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-bottom:4px;
}

.coordinate-box strong{
    color:var(--navy);
    font-size:12px;
}


/* ================= FACILITIES ================= */

.checkbox-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.checkbox-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:12px;
    background:#fff;
}

.checkbox-item input{
    width:auto;
}


/* ================= FOOD ================= */

.food-extra{
    display:none;
    margin-top:17px;
}

.food-extra.active{
    display:block;
}


/* ================= PHOTOS ================= */

.photo-upload{
    padding:25px;
    border:2px dashed #D8D1C5;
    border-radius:12px;
    background:#FAF8F3;
    text-align:center;
}

.photo-upload-icon{
    font-size:35px;
    margin-bottom:10px;
}

.photo-upload-title{
    color:var(--navy);
    font-size:14px;
    font-weight:900;
    margin-bottom:6px;
}

.photo-upload-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-bottom:15px;
}

.file-input{
    width:100%;
}


/* ================= CONFIRMATION ================= */

.confirmation-box{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#FAF8F3;
}

.confirmation-box input{
    margin-top:2px;
}

.confirmation-box label{
    color:var(--text-light);
    font-size:11px;
    line-height:1.6;
    font-weight:500;
}


/* ================= SUBMIT ================= */

.submit-property-btn{
    width:100%;
    border:none;
    padding:16px;
    border-radius:10px;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    font-size:14px;
    font-weight:900;
}

.submit-property-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* ================= SEARCH RESULT ================= */

.search-result-bar{
    max-width:1200px;
    margin:-35px auto 0;
    padding:0 20px;
    position:relative;
    z-index:10;
    display:none;
}

.search-result-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:14px 18px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#fff;
}

.search-result-text{
    color:var(--text-light);
    font-size:13px;
    font-weight:700;
}

.clear-search-btn{
    border:none;
    padding:8px 12px;
    border-radius:7px;
    color:var(--navy);
    background:#F1EEE6;
    font-size:11px;
    font-weight:800;
}


/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .hero h1{
        font-size:42px;
    }

    .search-box{
        grid-template-columns:1fr 1fr;
    }

    .categories{
        grid-template-columns:repeat(3,1fr);
    }

    .areas{
        grid-template-columns:repeat(3,1fr);
    }

    .listings{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .navbar{
        height:auto;
        min-height:65px;
        padding:12px 15px;
        gap:7px;
    }

    .logo{
        font-size:20px;
    }

    .language-select{
        min-width:75px;
        height:38px;
        font-size:10px;
        padding-left:7px;
    }

    .list-property-btn{
        padding:9px 10px;
        font-size:10px;
    }

    .hero{
        padding:65px 15px;
    }

    .hero h1{
        font-size:34px;
        letter-spacing:-1px;
    }

    .hero p{
        font-size:14px;
    }

    .search-box{
        grid-template-columns:1fr;
    }

    .search-field{
        border-right:none;
        border-bottom:1px solid rgba(30,58,95,.08);
    }

    .search-btn{
        min-height:48px;
    }

    .categories{
        grid-template-columns:repeat(2,1fr);
    }

    .areas{
        grid-template-columns:repeat(2,1fr);
    }

    .listings{
        grid-template-columns:1fr;
    }

    .steps{
        grid-template-columns:1fr;
    }

    .owner-box{
        flex-direction:column;
        align-items:flex-start;
    }

    .owner-btn{
        width:100%;
    }

    .footer-container{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .availability-grid{
        grid-template-columns:1fr;
    }

    .checkbox-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .property-form{
        padding:20px;
    }

}


/* =========================================================
   ADMIN
========================================================= */

.admin-panel{
    width:100%;
    max-width:1100px;
    max-height:92vh;
    overflow-y:auto;
    border-radius:18px;
    background:#F8F6F1;
    box-shadow:0 40px 100px rgba(23,32,51,.35);
}

.admin-header{
    position:sticky;
    top:0;
    z-index:5;
    padding:20px 25px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.admin-header h2{
    color:var(--navy);
}

.admin-header p{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.admin-content{
    padding:25px;
}

.admin-login{
    max-width:430px;
    margin:40px auto;
    background:#fff;
    padding:30px;
    border-radius:15px;

.admin-login h2{

}

.admin-login p{
    color:var(--muted);
    font-size:12px;
    margin-bottom:20px;
}

.admin-login input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.admin-login button{

    border-radius:8px;

    background:var(--navy);
    font-weight:800;
}

.admin-count{

    font-weight:800;
}

.admin-list{
    display:grid;
    gap:15px;
}

.admin-card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:13px;
    padding:20px;
    box-shadow:0 8px 20px rgba(38,45,55,.06);
}

}

.admin-card h3{
    color:var(--navy);
    margin-bottom:5px;
}

.admin-card small{
    color:var(--muted);
}

.pending-badge{

    padding:6px 9px;
    border-radius:20px;
    background:#FFF2D9;
    color:#9A681F;
    font-size:10px;
    font-weight:800;
}

    display:grid;
    grid-template-columns:repeat(3,1fr);

    margin:17px 0;
}

.admin-detail{
    padding:10px;
    border-radius:8px;

}

.admin-detail small{
    display:block;
    margin-bottom:4px;
    font-size:9px;
}

    font-size:12px;
    color:var(--text);
}

.admin-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.admin-actions button{
    border:none;
    padding:10px 14px;
    border-radius:7px;
    font-size:11px;
    font-weight:800;
}

.approve-btn{
    background:#E4F3E7;
    color:#24703A;
}

.reject-btn{
    background:#FBE5E4;
    color:#A63B38;
}

.maps-admin-btn{
    background:#E7EDF5;
    color:var(--navy);
}

.admin-image-row{
    display:flex;
    gap:8px;
    margin:12px 0;
    overflow-x:auto;
}

.admin-image-row img{

    height:70px;

<script>

/* =========================================================
   CONFIG
========================================================= */

const ROOMUPS_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbwOIVLGinX_wA6KLS3IoMnv5JhWtJv0SpjZIyvoUo5TZnL59G7gbZqLUMTeL5Y6tYi1/exec";


let approvedListings = [];

let adminToken =
sessionStorage.getItem("roomupsAdminToken") || "";


let currentLatitude = "";

let currentLongitude = "";


/* =========================================================
   MODAL
========================================================= */

function openPropertyModal(){

    document
        .getElementById("propertyModal")
        .classList.add("active");

    document.body.classList.add("modal-open");

}


function closePropertyModal(){

    document
        .getElementById("propertyModal")
        .classList.remove("active");

    document.body.classList.remove("modal-open");

}


function closeModalOutside(event){

    if(
        event.target.id === "propertyModal"
    ){

        closePropertyModal();

    }

}


/* =========================================================
   FOOD DETAILS
========================================================= */

function toggleFoodDetails(){

    const food =
        document.getElementById(
            "foodAvailable"
        ).value;


    const extra =
        document.getElementById(
            "foodExtra"
        );


    if(food === "Yes"){

        extra.classList.add("active");

    }else{

        extra.classList.remove("active");

    }

}


/* =========================================================
   LOCATION
   IMPORTANT:
   LOCATION IS OPTIONAL
========================================================= */

function getCurrentLocation(){

    const status =
        document.getElementById(
            "locationStatus"
        );


    if(!navigator.geolocation){

        status.textContent =
            "Location is unavailable in this browser. You can continue without it.";

        return;

    }


    status.textContent =
        "Getting your current location...";


    navigator.geolocation.getCurrentPosition(

        function(position){

            currentLatitude =
                position.coords.latitude;


            currentLongitude =
                position.coords.longitude;


            document.getElementById(
                "latitudeText"
            ).textContent =
                currentLatitude.toFixed(6);


            document.getElementById(
                "longitudeText"
            ).textContent =
                currentLongitude.toFixed(6);


            document.getElementById(
                "coordinatesBox"
            ).style.display =
                "grid";


            document.getElementById(
                "openMapsButton"
            ).disabled =
                false;


            status.textContent =
                "✓ Location added. You can still change or remove it before submitting.";

        },


        function(){

            currentLatitude = "";

            currentLongitude = "";


            document.getElementById(
                "coordinatesBox"
            ).style.display =
                "none";


            document.getElementById(
                "openMapsButton"
            ).disabled =
                true;


            status.textContent =
                "Unable to get location. That's okay — location is optional and you can continue.";

        },


        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }

    );

}


function openSelectedLocation(){

    if(
        currentLatitude === "" ||
        currentLongitude === ""
    ){

        return;

    }


    const url =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(
            currentLatitude +
            "," +
            currentLongitude
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================================================
   FILE TO BASE64
========================================================= */

function fileToBase64(file){

    return new Promise(

        function(resolve,reject){

            const reader =
                new FileReader();


            reader.onload =
                function(){

                    const result =
                        String(
                            reader.result || ""
                        );


                    const comma =
                        result.indexOf(",");


                    resolve(

                        comma >= 0

                        ? result.substring(
                            comma + 1
                        )

                        : result

                    );

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }

    );

}


/* =========================================================
   SUBMIT PROPERTY
========================================================= */

async function submitProperty(event){

    event.preventDefault();


    const submitButton =
        document.getElementById(
            "submitPropertyBtn"
        );


    submitButton.disabled =
        true;


    submitButton.textContent =
        "Submitting...";


    try{


        const files =
            document.getElementById(
                "photos"
            ).files;


        if(!files.length){

            throw new Error(
                "Please upload at least one property photo."
            );

        }


        if(files.length > 8){

            throw new Error(
                "You can upload a maximum of 8 photos."
            );

        }


        const photoData = [];


        for(

            let i = 0;

            i < files.length;

            i++

        ){

            const file =
                files[i];


            const base64 =
                await fileToBase64(
                    file
                );


            photoData.push({

                name:file.name,

                type:file.type,

                data:base64

            });

        }


        const facilities =
            Array.from(

                document.querySelectorAll(
                    ".checkbox-item input:checked"
                )

            ).map(

                function(input){

                    return input.value;

                }

            );


        /*
         * IMPORTANT:
         * latitude and longitude are NOT required.
         * Empty strings are sent if owner does not
         * share location.
         */


        const payload = {

            action:
                "submitListing",


            propertyType:
                document.getElementById(
                    "propertyType"
                ).value,


            propertyName:
                document.getElementById(
                    "propertyName"
                ).value,


            description:
                document.getElementById(
                    "description"
                ).value,


            availability:
                document.getElementById(
                    "availability"
                ).value,


            availableFrom:
                document.getElementById(
                    "availableFrom"
                ).value,


            area:
                document.getElementById(
                    "area"
                ).value,


            address:
                document.getElementById(
                    "address"
                ).value,


            rent:
                document.getElementById(
                    "price"
                ).value,


            deposit:
                document.getElementById(
                    "deposit"
                ).value,


            electricity:
                document.getElementById(
                    "electricity"
                ).value,


            water:
                document.getElementById(
                    "water"
                ).value,


            furnishing:
                document.getElementById(
                    "furnishing"
                ).value,


            bathroom:
                document.getElementById(
                    "bathroom"
                ).value,


            kitchen:
                document.getElementById(
                    "kitchen"
                ).value,


            suitableFor:
                document.getElementById(
                    "suitableFor"
                ).value,


            facilities:
                facilities,


            foodAvailable:
                document.getElementById(
                    "foodAvailable"
                ).value,


            foodType:
                document.getElementById(
                    "foodType"
                ).value,


            foodPrice:
                document.getElementById(
                    "foodPrice"
                ).value,


            ownerName:
                document.getElementById(
                    "ownerName"
                ).value,


            ownerPhone:
                document.getElementById(
                    "ownerPhone"
                ).value,


            whatsapp:
                document.getElementById(
                    "whatsapp"
                ).value,


            preferredContact:
                document.getElementById(
                    "preferredContact"
                ).value,


            /* LOCATION FIX */
            latitude:
                currentLatitude || "",


            longitude:
                currentLongitude || "",


            photoData:
                photoData

        };


        const response =
            await fetch(

                ROOMUPS_WEB_APP_URL,

                {

                    method:"POST",

                    body:JSON.stringify(
                        payload
                    )

                }

            );


        const text =
            await response.text();


        let result;


        try{

            result =
                JSON.parse(text);

        }catch(error){

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if(
            !result ||
            !result.success
        ){

            throw new Error(

                result &&
                result.message

                ? result.message

                : "Unable to submit listing."

            );

        }


        alert(

            result.message ||

            "Your property has been submitted successfully for verification."

        );


        document
            .getElementById(
                "propertyForm"
            )
            .reset();


        currentLatitude = "";

        currentLongitude = "";


        document.getElementById(
            "coordinatesBox"
        ).style.display =
            "none";


        document.getElementById(
            "openMapsButton"
        ).disabled =
            true;


        document.getElementById(
            "locationStatus"
        ).textContent =
            "Location sharing is optional.";


        document.getElementById(
            "foodExtra"
        ).classList.remove(
            "active"
        );


        closePropertyModal();


    }catch(error){

        console.error(error);


        alert(

            "Unable to submit property.\n\n" +

            (

                error.message ||

                "Please try again."

            )

        );


    }finally{

        submitButton.disabled =
            false;


        submitButton.textContent =
            "Submit for Verification →";

    }

}


/* =========================================================
   GET APPROVED LISTINGS
========================================================= */

async function loadApprovedListings(){

    const container =
        document.getElementById(
            "listingContainer"
        );


    try{

        const response =
            await fetch(

                ROOMUPS_WEB_APP_URL +
                "?action=getApprovedListings"

            );


        const result =
            await response.json();


        if(
            !result ||
            !result.success
        ){

            throw new Error(
                "Unable to load listings."
            );

        }


        approvedListings =

            Array.isArray(
                result.listings
            )

            ? result.listings

            : [];


        renderListings(
            approvedListings
        );


    }catch(error){

        console.error(error);


        container.innerHTML =
            `
            <div class="listing-message">
                Unable to load listings right now.
            </div>
            `;

    }

}


/* =========================================================
   RENDER LISTINGS
========================================================= */

function renderListings(listings){

    const container =
        document.getElementById(
            "listingContainer"
        );


    container.innerHTML = "";


    if(!listings.length){

        container.innerHTML =
            `
            <div class="listing-message">
                No matching listings found.
            </div>
            `;

        return;

    }


    listings.forEach(

        function(data){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "listing-card";


            let image =
                "🏠";


            if(

                Array.isArray(
                    data.photoLinks
                ) &&

                data.photoLinks.length

            ){

                image =
                    `
                    <img
                        src="${escapeHtml(
                            data.photoLinks[0]
                        )}"
                        alt="Property"
                        loading="lazy">
                    `;

            }


            let tags = "";


            if(

                Array.isArray(
                    data.facilities
                )

            ){

                data.facilities
                    .slice(0,4)
                    .forEach(

                        function(item){

                            tags +=
                                `
                                <span class="tag">
                                    ${escapeHtml(item)}
                                </span>
                                `;

                        }

                    );

            }


            if(

                data.foodAvailable ===
                "Yes"

            ){

                tags +=
                    `
                    <span class="tag">
                        🍱 Food Available
                    </span>
                    `;

            }


            card.innerHTML =
                `

                <div class="listing-image">

                    <span class="verified">

/* =========================================================
   SEARCH
   UPDATED:
   - Waits for listings to load before filtering.
   - Refreshes listings when Search is clicked.
   - Supports type + area + budget together.
   - Handles area naming variations.
========================================================= */

function normalizeSearchText(value){

    return String(

        value == null
        ? ""
        : value

    )
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");

}


function normalizeSearchArea(value){

    return normalizeSearchText(value)

        .replace(
            /\s*\/\s*/g,
            "/"
        )

        .replace(
            /\s*-\s*/g,
            "-"
        );

}


function areaMatches(
    selectedArea,
    listingArea
){

    const selected =
        normalizeSearchArea(
            selectedArea
        );


    const listing =
        normalizeSearchArea(
            listingArea
        );


    if(!selected){

        return true;

    }


    if(!listing){

        return false;

    }


    if(selected === listing){

        return true;

    }


    /*
     * This also allows a listing stored as
     * "Kacheri Adda" to match the combined
     * search option "Kacheri / Kacheri Adda".
     */


    const selectedParts =
        selected
        .split("/")
        .map(

            function(part){

                return part.trim();

            }

        )
        .filter(Boolean);


    const listingParts =
        listing
        .split("/")
        .map(

            function(part){

                return part.trim();

            }

        )
        .filter(Boolean);


    return selectedParts.some(

        function(part){

            return (

                listing === part ||

                listingParts.includes(part) ||

                listing.includes(part) ||

                part.includes(listing)

            );

        }

    );

}


async function refreshListingsForSearch(){

    try{

        const response =
            await fetch(
                ROOMUPS_WEB_APP_URL +
                "?action=getApprovedListings&_=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Unable to connect to listings server."
            );

        }


        const result =
            await response.json();


        if(
            result &&
            result.success &&
            Array.isArray(
                result.listings
            )
        ){

            approvedListings =
                result.listings;

            return true;

        }


    }catch(error){

        console.warn(
            "RoomUps search refresh failed:",
            error
        );

    }


    return false;

}


async function searchListings(){

    const searchButton =
        document.querySelector(
            ".search-btn"
        );


    const originalText =
        searchButton
        ? searchButton.textContent.trim()
        : "Search";


    const typeElement =
        document.getElementById(
            "searchType"
        );


    const areaElement =
        document.getElementById(
            "searchArea"
        );


    const budgetElement =
        document.getElementById(
            "searchBudget"
        );


    if(
        !typeElement ||
        !areaElement ||
        !budgetElement
    ){

        console.error(
            "RoomUps Search: search fields were not found."
        );

        return;

    }


    const type =
        normalizeSearchText(
            typeElement.value
        );


    const area =
        normalizeSearchArea(
            areaElement.value
        );


    const budget =
        budgetElement.value;


    /*
     * Show loading state.
     */

    if(searchButton){

        searchButton.disabled =
            true;

        searchButton.textContent =
            "Searching...";

    }


    try{

        /*
         * If listings have not loaded yet, fetch them first.
         * Also refresh every time Search is clicked so newly
         * approved properties can appear without a full reload.
         */

        const refreshed =
            await refreshListingsForSearch();


        /*
         * If refresh failed but we already have listings,
         * continue using the existing data.
         */

        if(
            !refreshed &&
            !Array.isArray(
                approvedListings
            )
        ){

            approvedListings = [];

        }


        const filtered =
            approvedListings.filter(

                function(data){

                    const listingType =
                        normalizeSearchText(
                            data.propertyType
                        );


                    const listingArea =
                        normalizeSearchArea(
                            data.area
                        );


                    const rent =
                        Number(

                            String(
                                data.rent ||
                                data.price ||
                                0
                            )
                            .replace(
                                /[^0-9.]/g,
                                ""
                            )

                        );


                    let typeMatch =
                        true;


                    let areaMatch =
                        true;


                    let budgetMatch =
                        true;


                    /*
                     * TYPE
                     */

                    if(type){

                        typeMatch =
                            listingType ===
                                type ||

                            listingType.includes(
                                type
                            ) ||

                            type.includes(
                                listingType
                            );

                    }


                    /*
                     * AREA
                     */

                    if(area){

                        areaMatch =
                            areaMatches(
                                area,
                                listingArea
                            );

                    }


                    /*
                     * BUDGET
                     */

                    if(budget){

                        const parts =
                            budget.split("-");


                        const min =
                            Number(
                                parts[0]
                            );


                        const max =
                            Number(
                                parts[1]
                            );


                        budgetMatch =
                            !isNaN(rent) &&
                            rent >= min &&
                            rent <= max;

                    }


                    return (
                        typeMatch &&
                        areaMatch &&
                        budgetMatch
                    );

                }

            );


        /*
         * Render only the matching listings.
         */

        renderListings(
            filtered
        );


        /*
         * Update result bar.
         */

        const resultBar =
            document.getElementById(
                "searchResultBar"
            );


        const resultText =
            document.getElementById(
                "searchResultText"
            );


        if(resultBar){

            resultBar.style.display =
                "block";

        }


        if(resultText){

            if(roomUpsLanguage === "hi") {

                resultText.textContent =
                    filtered.length +

                    (
                        filtered.length === 1
                        ? " लिस्टिंग मिली"
                        : " लिस्टिंग मिलीं"
                    );

            } else {

                resultText.textContent =
                    filtered.length +

                    (
                        filtered.length === 1
                        ? " listing found"
                        : " listings found"
                    );

            }

        }


        /*
         * Move the user to the results.
         */

        const properties =
            document.getElementById(
                "properties"
            );


        if(properties){

            properties.scrollIntoView({

                behavior:"smooth",

                block:"start"

            });

        }


    }catch(error){

        console.error(
            "RoomUps search error:",
            error
        );


        const container =
            document.getElementById(
                "listingContainer"
            );


        if(container){

            container.innerHTML =
                `
                <div class="listing-message">

                    Unable to search listings right now.

                    <br>

                    Please try again.

                </div>
                `;

        }


    }finally{

        if(searchButton){

            searchButton.disabled =
                false;


            searchButton.textContent =
                originalText;

        }

    }

}

        document.getElementById(

        );

            "none";

    }


    renderListings(
        approvedListings
    );

}

let roomUpsLanguage =
    localStorage.getItem(
        "roomupsLanguage"
    ) || "en";


/*
 * IMPORTANT:
 * Text nodes do not have getAttribute()/setAttribute().
 * The old language switcher tried to call those methods on Text nodes,
 * which caused a JavaScript error and stopped Hindi translation completely.
 *
 * We store each original text node value in a WeakMap instead.
 */

const ROOMUPS_ORIGINAL_TEXT =
    new WeakMap();


function getOriginalText(node){

    if(
        ROOMUPS_ORIGINAL_TEXT.has(
            node
        )
    ){

        return ROOMUPS_ORIGINAL_TEXT.get(
            node
        );

    }


    const original =
        node.nodeValue || "";


    ROOMUPS_ORIGINAL_TEXT.set(
        node,
        original
    );


    return original;

}


function translateTextNode(
    node,
    language
){

    if(
        !node ||
        node.nodeType !==
            Node.TEXT_NODE
    ){

        return;

    }


    const original =
        getOriginalText(
            node
        );


    if(language === "hi"){

        const key =
            original.trim();


        const translated =
            ROOMUPS_TRANSLATIONS.hi[
                key
            ];


        if(translated){

            const leading =
                original.match(
                    /^\s*/
                )?.[0] || "";


            const trailing =
                original.match(
                    /\s*$/
                )?.[0] || "";


            node.nodeValue =
                leading +
                translated +
                trailing;

        }else{

            node.nodeValue =
                original;

        }

    }else{

        node.nodeValue =
            original;

    }

}


function translateAttributes(
    language
){

    const attributeMap = {

        "Example: Sharma Student PG":
            "उदाहरण: शर्मा स्टूडेंट PG",

        "Tell students about your property or service...":
            "छात्रों को अपनी प्रॉपर्टी या सेवा के बारे में बताएं...",

        "Example: Near Degree College":
            "उदाहरण: डिग्री कॉलेज के पास",

        "Example: 5500":
            "उदाहरण: 5500",

        "Example: 5000":
            "उदाहरण: 5000",

        "Example: 2500":
            "उदाहरण: 2500",

        "Full Name":
            "पूरा नाम",

        "10-digit mobile number":
            "10 अंकों का मोबाइल नंबर",

        "10-digit WhatsApp number":
            "10 अंकों का WhatsApp नंबर"

    };


    document
        .querySelectorAll(
            "input, textarea"
        )
        .forEach(
            function(element){

                [
                    "placeholder"
                ]
                .forEach(
                    function(attribute){

                        const current =
                            element.getAttribute(
                                attribute
                            );


                        if(!current){

                            return;

                        }


                        if(
                            !element.dataset
                                .roomupsOriginalPlaceholder
                        ){

                            element.dataset
                                .roomupsOriginalPlaceholder =
                                    current;

                        }


                        const original =
                            element.dataset
                                .roomupsOriginalPlaceholder;


                        if(
                            language === "hi"
                        ){

                            element.setAttribute(
                                attribute,
                                attributeMap[
                                    original
                                ] || original
                            );

                        }else{

                            element.setAttribute(
                                attribute,
                                original
                            );

                        }

                    }
                );

            }
        );

}


function applyLanguage(
    language
){

    roomUpsLanguage =
        language === "hi"
        ? "hi"
        : "en";


    localStorage.setItem(
        "roomupsLanguage",
        roomUpsLanguage
    );


    document.documentElement.lang =
        roomUpsLanguage;


    const selector =
        document.getElementById(
            "languageSelect"
        );


    if(selector){

        selector.value =
            roomUpsLanguage;

    }


    const walker =
        document.createTreeWalker(

            document.body,

            NodeFilter.SHOW_TEXT,

            {

                acceptNode(node){

                    if(
                        !node.nodeValue ||
                        !node.nodeValue.trim()
                    ){

                        return NodeFilter
                            .FILTER_REJECT;

                    }


                    const parent =
                        node.parentElement;


                    if(!parent){

                        return NodeFilter
                            .FILTER_REJECT;

                    }


                    if(
                        [
                            "SCRIPT",
                            "STYLE"
                        ].includes(
                            parent.tagName
                        )
                    ){

                        return NodeFilter
                            .FILTER_REJECT;

                    }


                    return NodeFilter
                        .FILTER_ACCEPT;

                }

            }

        );


    const nodes = [];

    let node;


    while(
        (node = walker.nextNode())
    ){

        nodes.push(node);

    }


    nodes.forEach(
        function(textNode){

            translateTextNode(
                textNode,
                roomUpsLanguage
            );

        }
    );


    translateAttributes(
        roomUpsLanguage
    );


    if(
        roomUpsLanguage === "hi"
    ){

        document.title =
            ROOMUPS_TRANSLATIONS.hi[
                "RoomUps.in | Student Accommodation in Dharamshala"
            ] ||
            "RoomUps.in | धर्मशाला में छात्रों के लिए आवास";

    }else{

        document.title =
            "RoomUps.in | Student Accommodation in Dharamshala";

    }

}


function changeLanguage(
    language
){

    applyLanguage(
        language
    );

}


/*
 * renderListings() creates new HTML dynamically.
 * Re-apply the selected language after every fresh render.
 */

const roomUpsOriginalRenderListings =
    window.renderListings;


if(
    typeof roomUpsOriginalRenderListings ===
    "function"
){

    window.renderListings =
        function(listings){

            roomUpsOriginalRenderListings(
                listings
            );


            if(
                roomUpsLanguage === "hi"
            ){

                applyLanguage(
                    "hi"
                );

            }

        };

}


/*
 * Property details modal is also created dynamically.
 * applyLanguage() is already called from viewListing(), but this observer
 * also handles any future dynamically-created visible content safely.
 */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        setTimeout(
            function(){

                applyLanguage(
                    roomUpsLanguage
                );

            },
            0
        );

    }
);


</script>
